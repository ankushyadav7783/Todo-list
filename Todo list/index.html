<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

    li {
      background: #f1f1f1;
      padding: 8px;
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      border-radius: 5px;
    }

    li span {
      cursor: pointer;
      color: rgb(13, 177, 98);
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🔥 Todo List</h2>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter task...">
      <button>Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

 <script src="app.js"></script>
 
 <!-- onclick="addTask()" -->
</body>
</html>
